# ---------- General ----------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10           # avoid Esc lag affecting Alt-bindings

# ---------- Visuals (mirror WezTerm) ----------
# Red pane borders, like colors.split = '#ff0000'
set -g pane-border-style        "fg=red"
set -g pane-active-border-style "fg=red,bold"
# Dim inactive panes, like inactive_pane_hsb { brightness=0.4, saturation=0.4 }
set -g window-style        "fg=colour245"
set -g window-active-style "fg=default"

# ---------- Window tabs ----------
# Selected window is a solid red tab, matching the active pane border.
# Each tab shows the git branch of its active pane,
# and a flag for zoom. Activity and bell turn the tab yellow, so a Claude
# session waiting in a background window is easy to spot.
set -g status-interval 5
set -g monitor-activity on
set -g monitor-bell     on
set -g activity-action  other
set -g bell-action      other
set -g visual-activity  off

set -g status-style                 "bg=colour235,fg=colour245"
set -g status-left-length           30
set -g status-left                  "#[fg=white,bg=colour238,bold] #S #[default] "
set -g window-status-separator      ""
set -g window-status-format         " #I:#W#{?window_zoomed_flag, Z,}#{?window_activity_flag, *,}#{?window_bell_flag, !,}#(~/.config/tmux/git-label.sh '#{pane_current_path}' | sed 's/^./ [&/;s/.$/&]/') "
set -g window-status-current-format " #I:#W#{?window_zoomed_flag, Z,}#(~/.config/tmux/git-label.sh '#{pane_current_path}' | sed 's/^./ [&/;s/.$/&]/') "
set -g window-status-style          "fg=colour245,bg=colour235"
set -g window-status-current-style  "fg=white,bg=red,bold"
set -g window-status-activity-style "fg=yellow,bold"
set -g window-status-bell-style     "fg=black,bg=yellow,bold"

# Right: prefix indicator and clock
set -g status-right-length 40
set -g status-right "#{?client_prefix,#[fg=white#,bg=red#,bold] PREFIX #[default] ,}#[fg=colour245]%a %d %b %H:%M "

# ---------- Splits (Alt+h / Alt+v) ----------
bind -n M-h split-window -h -c "#{pane_current_path}"   # new pane to the right
bind -n M-v split-window -v -c "#{pane_current_path}"   # new pane below

# ---------- Pane navigation (Alt+arrows) ----------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ---------- Close current pane (Alt+w) ----------
bind -n M-w kill-pane

# ---------- New window (Alt+t) ----------
bind -n M-t new-window -c "#{pane_current_path}"

# ---------- Window navigation (Alt+Shift+arrows) ----------
bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

# ---------- Pane-aware mouse copy via OSC 52 ----------
set -g set-clipboard on
bind -T root MouseDrag1Pane if -F -t = "#{mouse_any_flag}" \
  "if -Ft= '#{pane_in_mode}' 'copy-mode -M' 'send-keys -M'" \
  "copy-mode -M"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# ---------- Pane labels (lmux) ----------
# lmux sets a @name option per pane; show it in the border, falling
# back to the pane's directory when unlabelled.
set -g pane-border-status top
set -g pane-border-format " #{?@name,#{@name},#{b:pane_current_path}} "

# ---------- Local overrides (untracked) ----------
source-file -q ~/.tmux.conf.local
