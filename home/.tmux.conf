# ---------- General ----------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10           # avoid Esc lag affecting Alt-bindings

# ---------- Visuals (mirror WezTerm) ----------
# Red pane borders, like colors.split = '#ff0000'
set -g pane-border-style        "fg=red"
set -g pane-active-border-style "fg=red,bold"
# Dim inactive panes, like inactive_pane_hsb { brightness=0.4, saturation=0.4 }
set -g window-style        "fg=colour245"
set -g window-active-style "fg=default"

# ---------- Splits (Alt+h / Alt+v) ----------
bind -n M-h split-window -h -c "#{pane_current_path}"   # new pane to the right
bind -n M-v split-window -v -c "#{pane_current_path}"   # new pane below

# ---------- Pane navigation (Alt+arrows) ----------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ---------- Close current pane (Alt+w) ----------
bind -n M-w kill-pane

# ---------- New window (Alt+t) ----------
bind -n M-t new-window -c "#{pane_current_path}"

# ---------- Window navigation (Alt+Shift+arrows) ----------
bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

# ---------- Pane-aware mouse copy via OSC 52 ----------
set -g set-clipboard on
bind -T root MouseDrag1Pane if -F -t = "#{mouse_any_flag}" \
  "if -Ft= '#{pane_in_mode}' 'copy-mode -M' 'send-keys -M'" \
  "copy-mode -M"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# ---------- Pane labels (lmux) ----------
# lmux sets a @name option per pane; show it in the border, falling
# back to the pane's directory when unlabelled.
set -g pane-border-status top
set -g pane-border-format " #{?@name,#{@name},#{b:pane_current_path}} "

# ---------- Local overrides (untracked) ----------
source-file -q ~/.tmux.conf.local
