format = "$username$hostname$directory$git_branch$git_commit$time$line_break$character"

[username]
show_always = true
format = "[$user]($style)@"
style_user = "bold yellow"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold green"
disabled = false

[directory]
format = "at 🚀 [$path]($style)[$read_only]($read_only_style) "
truncate_to_repo = true
truncation_length = 3
truncation_symbol = ""

[git_branch]
symbol = "🌱 "
truncation_length = 20
truncation_symbol = "..."

[git_commit]
only_detached = false
commit_hash_length = 7
tag_symbol = "🔖 "
tag_disabled = false

[line_break]
disabled = false

[time]
disabled = false
time_format = "%R"
format = '[$time]($style) '
